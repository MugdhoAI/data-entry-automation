[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-entry-automation"
version = "1.0.0"
description = "Validate, clean, and export structured data from CSV and Excel files."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<9",
]

[project.scripts]
data-entry = "data_entry_automation.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.setuptools.packages.find]
where = ["src"]
